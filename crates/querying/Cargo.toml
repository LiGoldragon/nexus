[package]
name = "nexus-querying"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nexus"
description = "The querying end of a connection to a Nexus socket: greet it, open exchanges on it, read what it delivers."
publish = false

[dependencies]
nexus-exchange = { path = "../exchange", version = "0.1.1" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
