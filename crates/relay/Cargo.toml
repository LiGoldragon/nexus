[package]
name = "nexus-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/nexus"
description = "One opaque request frame and one opaque reply, through one configured local socket."
publish = false

[dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9322ecae7a8821439179e778d495d7804a", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
